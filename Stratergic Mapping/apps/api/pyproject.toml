[project]
name = "stratergic-mapping-api"
version = "0.1.0"
description = "FastAPI backend for the 7Cs Disease Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.1",
  "boto3>=1.34.0",
  "chromadb>=0.5.3",
  "fastapi>=0.110.0",
  "httpx>=0.27.0",
  "openai>=1.30.0",
  "psycopg[binary]>=3.1.18",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "pypdf>=4.2.0",
  "python-multipart>=0.0.9",
  "python-pptx>=0.6.23",
  "redis>=5.0.4",
  "reportlab>=4.2.0",
  "rq>=1.16.2",
  "SQLAlchemy>=2.0.29",
  "uvicorn[standard]>=0.29.0"
]

[project.optional-dependencies]
dev = [
  "black>=24.4.0",
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.6",
  "ruff>=0.4.4"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
